name: Daily DSE Pipeline

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose build

      - name: Run DSE pipeline
        run: docker compose run --rm dse-pipeline